<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Portal - Teacher Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Hide number input spinners/arrows */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwctT1B5KZ726ZBxft7Lp1hdbv2wssSdBZd2CELa72LAhluHf4cI7vnA3oPEqxfgHwaPQ/exec";

    window.addEventListener('DOMContentLoaded', () => {
      const isAuth = sessionStorage.getItem('current_teacher_authenticated');
      if (!isAuth) {
        window.location.href = "teacher-signin.html";
        return;
      }
      fetchStudents();
    });

    let globalStudents = [];
    let globalFreeResponses = [];
    const TOTAL_QUESTIONS_PER_UNIT = 3;
    const UNITS_TO_TRACK = [4, 5, 6];
    
    // Maps internal unit numbers to display labels (e.g., internal unit 4 displays as unit 3)
    const UNIT_LABEL_MAP = {
      4: 3,
      5: 4,
      6: 5
    };

    function fetchStudents() {
      const mcBody = document.getElementById('students-table-body');
      const frBody = document.getElementById('fr-table-body');
      mcBody.innerHTML = `<tr><td colspan="3" class="px-6 py-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading student records...</td></tr>`;
      frBody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading free responses...</td></tr>`;

      const callbackName = 'handleDashboardResponse_' + Date.now();
      window[callbackName] = function(data) {
        delete window[callbackName];
        const elem = document.getElementById(callbackName);
        if (elem) elem.remove();

        if (data.status === "success") {
          globalStudents = data.students || [];
          globalFreeResponses = data.freeResponses || [];
          renderStudents(globalStudents);
          renderFreeResponses(globalFreeResponses);
        } else {
          mcBody.innerHTML = `<tr><td colspan="3" class="px-6 py-8 text-center text-red-500">Failed to load student records.</td></tr>`;
        }
      };

      const scriptUrl = `${WEB_APP_URL}?action=getStudents&callback=${callbackName}`;
      const scriptTag = document.createElement('script');
      scriptTag.id = callbackName;
      scriptTag.src = scriptUrl;
      scriptTag.onerror = function() {
        mcBody.innerHTML = `<tr><td colspan="3" class="px-6 py-8 text-center text-red-500">Connection error fetching records.</td></tr>`;
      };
      document.body.appendChild(scriptTag);
    }

    function renderStudents(students) {
      const tbody = document.getElementById('students-table-body');
      document.getElementById('student-count').textContent = `${students.length} Student${students.length === 1 ? '' : 's'}`;

      if (students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="px-6 py-8 text-center text-slate-400">No student accounts registered yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      students.forEach((s, index) => {
        const dropdownId = `dropdown-${index}`;
        const displayName = s.name || s.email;

        let unitSummariesHTML = '';
        for (let u of UNITS_TO_TRACK) {
          let count = 0;
          const unitObj = s.progress && s.progress['unit' + u] ? s.progress['unit' + u] : {};
          for (let q = 1; q <= TOTAL_QUESTIONS_PER_UNIT; q++) {
            if (unitObj['q' + q]) count++;
          }
          const displayUnitNum = UNIT_LABEL_MAP[u] !== undefined ? UNIT_LABEL_MAP[u] : u;
          unitSummariesHTML += `<span class="px-2.5 py-1 rounded-xl bg-indigo-50 text-indigo-700 text-xs font-bold border border-indigo-100 mr-2 mb-1 inline-block">Unit ${displayUnitNum}: ${count}/${TOTAL_QUESTIONS_PER_UNIT} Completed</span>`;
        }

        const tr = document.createElement('tr');
        tr.className = 'bg-white hover:bg-slate-50 transition-colors border-b border-slate-100 cursor-pointer';
        tr.onclick = () => toggleDropdown(dropdownId);

        tr.innerHTML = `
          <td class="px-6 py-4 text-sm font-semibold text-slate-800 flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs">
              ${displayName.charAt(0).toUpperCase()}
            </div>
            <div>
              <p class="text-slate-800">${displayName}</p>
              <p class="text-xs text-slate-400 font-normal">${s.email}</p>
            </div>
            <i class="fa-solid fa-chevron-down text-xs text-slate-400 ml-auto transition-transform" id="chevron-${index}"></i>
          </td>
          <td class="px-6 py-4 text-sm text-slate-600 font-medium">
            <div class="flex flex-wrap">${unitSummariesHTML}</div>
          </td>
          <td class="px-6 py-4 text-sm text-slate-500">${s.latestTimestamp ? new Date(s.latestTimestamp).toLocaleString() : 'N/A'}</td>
        `;
        tbody.appendChild(tr);

        const dropdownTr = document.createElement('tr');
        dropdownTr.id = dropdownId;
        dropdownTr.className = 'hidden bg-slate-50/80 border-b border-slate-200';
        
        let allUnitsBreakdownHTML = '';
        for (let u of UNITS_TO_TRACK) {
          let questionsDetailHTML = '';
          const unitObj = s.progress && s.progress['unit' + u] ? s.progress['unit' + u] : {};

          for (let q = 1; q <= TOTAL_QUESTIONS_PER_UNIT; q++) {
            const dataVal = unitObj['q' + q];
            let status = 'Incomplete';
            if (typeof dataVal === 'string') status = dataVal;
            else if (typeof dataVal === 'object' && dataVal !== null) {
              if (dataVal.score) status = `Score: ${dataVal.score}/10`;
              else status = dataVal.status || 'Submitted';
            }
            
            let badgeClass = 'bg-slate-200 text-slate-700';
            let icon = 'fa-circle-minus';
            if (status.startsWith('Score') || status === 'Correct' || status === 'Graded') {
              badgeClass = 'bg-emerald-100 text-emerald-800 border border-emerald-200';
              icon = 'fa-circle-check';
            } else if (status === 'Incorrect') {
              badgeClass = 'bg-red-100 text-red-800 border border-red-200';
              icon = 'fa-circle-xmark';
            } else if (status === 'Pending Review') {
              badgeClass = 'bg-amber-100 text-amber-800 border border-amber-200';
              icon = 'fa-clock';
            } else if (status === 'Draft') {
              badgeClass = 'bg-slate-100 text-slate-500 border border-slate-200';
              icon = 'fa-pen';
            }

            questionsDetailHTML += `
              <div class="flex items-center justify-between p-2.5 rounded-xl bg-white border border-slate-200 shadow-sm">
                <span class="text-xs font-bold text-slate-700">Q${q}</span>
                <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold flex items-center gap-1 ${badgeClass}">
                  <i class="fa-solid ${icon}"></i> ${status}
                </span>
              </div>
            `;
          }

          const displayUnitNum = UNIT_LABEL_MAP[u] !== undefined ? UNIT_LABEL_MAP[u] : u;
          allUnitsBreakdownHTML += `
            <div class="mb-4 last:mb-0">
              <h5 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Unit ${displayUnitNum} Breakdown</h5>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">${questions
