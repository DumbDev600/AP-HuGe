<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Portal - Teacher Sign In</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>

  <script>
    const TEACHER_PIN = "carter high teach"; // Secret Teacher PIN

    // TEACHER PIN HANDLER
    window.handleTeacherAuth = function(e) {
      e.preventDefault();
      dismissAlert();

      const pinInput = document.getElementById('teacher-pin').value.trim();

      if (pinInput !== TEACHER_PIN) {
        showAlert("Invalid Teacher PIN! Please enter the correct PIN.");
        return;
      }

      // Store teacher session authentication
      sessionStorage.setItem('current_teacher_authenticated', 'true');
      window.location.href = "teacher-dashboard.html";
    };

    // Alerts
    function showAlert(message) {
      const alertBox = document.getElementById('alert-box');
      const alertMessage = document.getElementById('alert-message');
      if (!alertBox) return;
      alertMessage.textContent = message;
      alertBox.classList.remove('hidden');
    }

    function dismissAlert() {
      const alertBox = document.getElementById('alert-box');
      if (alertBox) alertBox.classList.add('hidden');
    }
  </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between items-center p-4">

  <!-- HEADER -->
  <header class="w-full max-w-md my-4 text-center">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600 text-white font-bold text-2xl shadow-lg mb-3">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    <h1 class="font-extrabold text-2xl text-slate-800">Classroom Portal</h1>
    <p class="text-xs text-slate-500 font-medium mt-1">Sign in to access your classroom</p>
  </header>

  <!-- ALERT NOTIFICATION BANNER -->
  <div class="w-full max-w-md mb-4">
    <div id="alert-box" class="hidden p-4 rounded-2xl bg-red-50 border border-red-200 text-red-800 flex items-start gap-3 shadow-sm transition-all">
      <i class="fa-solid fa-triangle-exclamation text-red-600 text-lg mt-0.5"></i>
      <div class="flex-1 text-sm font-medium" id="alert-message"></div>
      <button onclick="dismissAlert()" class="text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
    </div>
  </div>

  <!-- AUTH CARD -->
  <main class="w-full max-w-md bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-xl my-auto">
    
    <!-- TAB SELECTOR -->
    <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-6">
      <button type="button" id="tab-student" onclick="window.location.href='index.html'" class="py-2.5 rounded-xl transition-all text-slate-500 hover:text-slate-800 cursor-pointer w-full text-center border border-transparent">
        <i class="fa-solid fa-user-graduate mr-1.5"></i> Student
      </button>
      <button type="button" id="tab-teacher" class="py-2.5 rounded-xl transition-all shadow-sm bg-white text-indigo-600 font-semibold cursor-pointer w-full text-center border border-slate-200">
        <i class="fa-solid fa-chalkboard-user mr-1.5"></i> Teacher
      </button>
    </div>

    <!-- TEACHER PIN FORM -->
    <div id="teacher-section">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Teacher Sign In</h2>
        <p class="text-xs text-slate-500 mt-1">Enter your secure Teacher PIN to access the dashboard.</p>
      </div>

      <form onsubmit="handleTeacherAuth(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-indigo-600 uppercase tracking-wider mb-1.5">Teacher PIN</label>
          <input type="password" id="teacher-pin" required placeholder="Enter PIN (e.g. 1234)" class="w-full px-4 py-3 rounded-xl border border-indigo-200 bg-indigo-50/50 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all text-sm">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl text-sm shadow-md hover:shadow-indigo-200 transition-all cursor-pointer mt-2">
          Sign In as Teacher
        </button>
      </form>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="my-4 text-center text-xs text-slate-400">
    Classroom Portal • Neocities Ready
  </footer>

</body>
</html>
